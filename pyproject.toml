[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinplausi"
version = "0.1.0"
description = "Digital twin -> Cosmos control maps -> physics-plausibility checks for AI-generated training videos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "imageio>=2.31",
    "imageio-ffmpeg>=0.4.9",
    "pybullet>=3.2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
twinplausi = "twinplausi.cli:main"

[tool.setuptools.packages.find]
include = ["twinplausi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
